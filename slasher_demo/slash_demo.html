        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }
        
        // 帶入按鈕元素的登入彈窗邏輯
        function openLoginModal(btnEvent) { 
            if(!isLoggedIn) { 
                const m = document.getElementById('login-modal'); 
                if(m) {
                    if(btnEvent) {
                        const box = m.querySelector('.bg-white');
                        const rect = btnEvent.getBoundingClientRect();
                        const scrollY = window.scrollY || document.documentElement.scrollTop;
                        box.style.marginTop = `${Math.max(20, rect.top + scrollY - 20)}px`;
                    }
                    m.classList.remove('hidden'); 
                } 
            } 
        }

        function simulateLogin() {
            isLoggedIn = true;
            const m = document.getElementById('login-modal');
            if(m) m.classList.add('hidden');
            renderPage(currentLang);
        }

        // 帶入按鈕元素的課程彈窗邏輯
        function openCourseModal(index, btnEvent) {
            const c = mockEducation[index][currentLang];
            const safeSet = (id, text) => { const el = document.getElementById(id); if(el) el.innerText = text; }
            safeSet('modal-tag', c.tag);
            safeSet('modal-title', c.title);
            safeSet('modal-desc', c.desc);
            safeSet('modal-syllabus-title', uiTranslations[currentLang].syllabusTitle);
            safeSet('modal-btn', uiTranslations[currentLang].enrollBtn);
            safeSet('modal-close-btn', uiTranslations[currentLang].closeBtn);
            
            const list = document.getElementById('modal-syllabus-list');
            if(list) list.innerHTML = c.syllabus.map(i => `<li>${i}</li>`).join('');
            
            const modal = document.getElementById('course-modal');
            
            if (btnEvent) {
                const innerBox = modal.querySelector('.bg-white');
                const rect = btnEvent.getBoundingClientRect();
                const scrollY = window.scrollY || document.documentElement.scrollTop;
                innerBox.style.marginTop = `${Math.max(20, rect.top + scrollY - 100)}px`;
                innerBox.style.marginBottom = '40px'; 
            }
            
            if(modal) modal.classList.remove('hidden');
        }

        function closeModal() { const m = document.getElementById('course-modal'); if(m) m.classList.add('hidden'); }
        function showDemoAlert() { alert("【Demo】此為原型系統，真實功能將在後續接入。"); }

        function filterJobs(category) {
            currentFilter = category;
            const btns = [
                {id: 'flt-all', cat: 'All'},
                {id: 'flt-trans', cat: 'Translation'},
                {id: 'flt-remote', cat: 'Remote'},
                {id: 'flt-it', cat: 'IT'},
                {id: 'flt-edu-btn', cat: 'Education'},
                {id: 'flt-tour', cat: 'Tourism'}
            ];
            btns.forEach(b => {
                const el = document.getElementById(b.id);
                if(el) {
                    if(b.cat === category) {
                        el.className = `px-4 py-1 rounded-full text-sm font-semibold bg-indigo-600 text-white transition-colors whitespace-nowrap`;
                    } else {
                        el.className = `px-4 py-1 rounded-full text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors whitespace-nowrap`;
                    }
                }
            });
            renderJobs();
        }

        function renderJobs() {
            const container = document.getElementById('jobs-container');
            if(!container) return; 
            
            const filtered = currentFilter === 'All' ? mockJobs : mockJobs.filter(j => j.category === currentFilter);
            container.innerHTML = filtered.map(job => `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 dark:border-gray-700 overflow-hidden fade-in flex flex-col">
                    <img src="${job.img}" class="w-full h-40 object-cover">
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="px-3 py-1 bg-indigo-50 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 rounded-full text-xs font-semibold">${job[currentLang].tag}</span>
                                <span class="text-green-600 dark:text-green-400 font-bold" dir="ltr">${job[currentLang].pay}</span>
                            </div>
                            <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">${job[currentLang].title}</h3>
                            <p class="text-gray-600 dark:text-gray-300 text-sm mb-4">${job[currentLang].desc}</p>
                        </div>
                        <button onclick="showDemoAlert()" class="w-full bg-gray-50 dark:bg-gray-700 hover:bg-indigo-600 dark:hover:bg-indigo-600 hover:text-white text-indigo-600 dark:text-indigo-300 font-semibold py-2 rounded-lg transition-colors">
                            ${uiTranslations[currentLang].applyBtn}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderPage(lang) {
            currentLang = lang;
            document.body.setAttribute('dir', lang === 'ur' ? 'rtl' : 'ltr');
            const ui = uiTranslations[lang];

            const safeSetText = (id, text) => { const el = document.getElementById(id); if(el) el.innerText = text; }
            const safeSetHTML = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; }

            safeSetText('ui-logo-title', ui.logoTitle);
            safeSetText('ui-hero-title', ui.heroTitle);
            safeSetText('ui-hero-desc', ui.heroDesc);
            safeSetHTML('ui-job-title', `<span class="text-2xl mr-2">💼</span> ${ui.jobTitle.replace('💼 ', '')}`);
            safeSetHTML('ui-edu-title', `<span class="text-2xl mr-2">📚</span> ${ui.eduTitle.replace('📚 ', '')}`);
            safeSetHTML('ui-com-title', `<span class="text-2xl mr-2">🤝</span> ${ui.comTitle.replace('🤝 ', '')}`);
            safeSetText('ui-login-title', ui.loginTitle);
            
            safeSetText('flt-all', ui.fltAll);
            safeSetText('flt-trans', ui.fltTrans);
            safeSetText('flt-remote', ui.fltRemote);
            safeSetText('flt-it', ui.fltIt);
            safeSetText('flt-edu-btn', ui.fltEdu);
            safeSetText('flt-tour', ui.fltTour);

            const authSection = document.getElementById('auth-section');
            if (authSection) {
                if (isLoggedIn) {
                    authSection.innerHTML = `
                        <div class="flex items-center space-x-2 bg-gray-100 dark:bg-gray-700 px-3 py-1 rounded-full cursor-pointer">
                            <div class="w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center text-xs font-bold">A</div>
                            <span class="text-sm font-semibold dark:text-white" dir="ltr">Hi, Ali</span>
                        </div>`;
                } else {
                    authSection.innerHTML = `<button onclick="openLoginModal(this)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-full text-sm font-semibold transition-colors">${ui.loginBtn}</button>`;
                }
            }

            renderJobs();

            const eduContainer = document.getElementById('edu-container');
            if (eduContainer) {
                eduContainer.innerHTML = mockEducation.map((edu, idx) => `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col">
                        <img src="${edu.img}" class="w-full h-40 object-cover">
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="px-3 py-1 bg-blue-50 dark:bg-blue-900 text-blue-600 dark:text-blue-300 rounded-full text-xs font-semibold">${edu[lang].tag}</span>
                                <h3 class="text-lg font-bold text-gray-800 dark:text-white mt-3">${edu[lang].title}</h3>
                                <p class="text-gray-600 dark:text-gray-300 text-sm mt-2">${edu[lang].desc}</p>
                            </div>
                            <!-- 修改此處，將 this 傳遞給 JS -->
                            <button onclick="openCourseModal(${idx}, this)" class="text-blue-600 dark:text-blue-400 font-semibold text-sm flex items-center mt-4 bg-transparent border-none cursor-pointer p-0">
                                ${ui.learnBtn} <span class="mx-1">→</span>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            const comContainer = document.getElementById('com-container');
            if (comContainer) {
                comContainer.innerHTML = mockCommunity.map(com => `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col">
                        <img src="${com.img}" class="w-full h-40 object-cover">
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="px-3 py-1 bg-emerald-50 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300 rounded-full text-xs font-semibold">${com[lang].tag}</span>
                                <h3 class="text-lg font-bold text-gray-800 dark:text-white mt-3">${com[lang].title}</h3>
                                <p class="text-gray-600 dark:text-gray-300 text-sm mt-2">${com[lang].desc}</p>
                            </div>
                            <button onclick="showDemoAlert()" class="w-full mt-4 bg-emerald-50 dark:bg-gray-700 hover:bg-emerald-600 dark:hover:bg-emerald-600 hover:text-white text-emerald-600 dark:text-emerald-300 font-semibold py-2 rounded-lg transition-colors">
                                ${ui.joinBtn}
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        const langSelector = document.getElementById('lang-selector');
        if(langSelector) langSelector.addEventListener('change', e => renderPage(e.target.value));
        
        renderPage('zh');
    </script>
